spring.application.name=nadi-astrology-backend

# ============================================================
# PostgreSQL
# ============================================================

spring.datasource.url=${spring.datasource.url}
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hibernate batch fetching
spring.jpa.properties.hibernate.default_batch_fetch_size=50


# ============================================================
# JWT
# ============================================================

jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-characters
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000


# ============================================================
# Redis
# ============================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms


# ============================================================
# Security Logging
# ============================================================

logging.level.org.springframework.security=INFO


# ============================================================
# Cloudinary
# ============================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ============================================================
# Razorpay
# ============================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


# ============================================================
# Zoom
# ============================================================

zoom.account-id=${ZOOM_ACCOUNT_ID}
zoom.client-id=${ZOOM_CLIENT_ID}
zoom.client-secret=${ZOOM_CLIENT_SECRET}

zoom.oauth-url=https://zoom.us/oauth/token
zoom.api-url=https://api.zoom.us/v2

zoom.host-user-id=${ZOOM_HOST_USER_ID}


# ============================================================
# Email
# ============================================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ============================================================
# Application
# ============================================================

app.admin.email=${ADMIN_EMAIL}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# ============================================================
# Google OAuth
# ============================================================

google.client-id=169547858740-1a6faauf9d9v6fiahdeu36atjtqd813j.apps.googleusercontent.com


# ============================================================
# File Upload
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
